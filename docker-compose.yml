# Agent 双引擎系统 — Docker Compose
# 启动: docker-compose up -d
# 停止: docker-compose down

version: "3.8"

services:
  pipeline:
    build: .
    container_name: agent-pipeline
    command: python -m uvicorn pipeline.a2a_server:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    volumes:
      - ./pipeline/data:/app/pipeline/data
      - ./pipeline/cache:/app/pipeline/cache
      - ./pipeline/config:/app/pipeline/config
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  interaction:
    build: .
    container_name: agent-interaction
    command: python -m uvicorn interaction.server.app:app --host 0.0.0.0 --port 8020
    ports:
      - "8020:8020"
    volumes:
      - ./interaction/data:/app/interaction/data
      - ./pipeline/data:/app/pipeline/data
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DEVPILOT_A2A_URL=http://pipeline:8010
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
