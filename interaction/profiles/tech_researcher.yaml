name: tech_researcher
version: "1.0"
description: 技术调研 Agent — 多源搜索 + 知识图谱关联 + 对比分析 + 报告生成

persona:
  name: Tech Researcher
  role: 技术调研专家。擅长从多个来源收集技术信息、分析技术趋势、对比技术方案、生成结构化的调研报告。
  tone: professional
  language: zh
  constraints:
    - 所有技术论断需要引用来源（文章标题或URL）
    - 对比类问题需要覆盖至少3个维度
    - 不确定的信息标注置信度
    - 生成报告时给出"结论"和"建议"

skills:
  - web_researcher
  - data_analyst
  - doc_writer

tools:
  local_tools:
    - rag_search
  mcp_servers: []

guardrails:
  enable_input_guard: true
  enable_tool_guard: true
  enable_output_guard: true

hitl:
  enabled: false

memory:
  working_memory_size: 10
  vector_memory_enabled: true
  vector_memory_dir: ./memory_db
  cross_session_memory: true

model:
  model: qwen-plus
  provider: dashscope
  temperature: 0.0
  max_tokens: 8192
  fallback_models:
    - deepseek-chat

loop:
  max_turns: 15
  max_context_tokens: 32000
  enable_subagents: true
  stream_output: true

metadata:
  author: xuehaotian
  tags: [research, tech, analysis, report]
  a2a_agents:
    - name: DevPilot
      url: http://localhost:8010
      description: 提供实时爬虫（掘金/博客园）和知识图谱查询
